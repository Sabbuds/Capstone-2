name: Security tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install browser test dependency
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build and test detectors, repairs and browser UI
        shell: pwsh
        run: ./scripts/test.ps1 -JavaHome $env:JAVA_HOME
